<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-omega-192.png">
<link rel="apple-touch-icon" href="/icon-omega-192.png">
<title>Joe's Cockpit</title>
<style>
/* ── RESET / base ── */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
/* ROUND-10: Joe's exact palette as CSS vars */
:root{
  --bg-main:#0d1117; --bg-card:#161b22; --bg-hover:#21262d;
  --border-subtle:#30363d; --text-primary:#f0f6fc; --text-muted:#8b949e;
  --accent-focus:#58a6ff;
}
/* ROUND-9 premium: clean sans stack + #0d1117 base, thin dividers, micro-press */
body{font-family:system-ui,-apple-system,'Segoe UI',BlinkMacSystemFont,sans-serif;
  background:#0d1117;color:#e6edf3;min-height:100dvh;
  padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 30px);
  user-select:none;-webkit-user-select:none}
/* interactive elements / cards / button states = lighter slate #161b22 */
.slate{background:#161b22}
.btn,.item,.plan-card,.slot,.show-rest{border:1px solid #30363d;
  transition:transform .1s ease;background:#161b22}
.btn:active,.plan-book:active,.slot:active,.item:active{border-color:#30363d;
  transform:scale(.98);transition:transform .1s ease}
/* active text bright, secondary/completed muted */
.title{color:#f0f6fc}
.ctx{color:#8b949e}
/* ── GLASSMORPHIC atoms (Joe: #0d1117 dark glass) ── */
.glass{background:rgba(22,27,34,.55);-webkit-backdrop-filter:blur(18px) saturate(1.15);
  backdrop-filter:blur(18px) saturate(1.15);border:1px solid rgba(48,54,61,.55);
  border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.02)}
.glass-strong{background:rgba(22,27,34,.72);backdrop-filter:blur(24px) saturate(1.2);
  border:1px solid rgba(88,166,255,.28);border-radius:24px;box-shadow:0 14px 38px rgba(0,0,0,.5)}
/* ── ROUND-14: custom confirm modal (replaces window.confirm) ── */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  padding:24px;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.modal.modal-active{display:flex}
.modal-box{width:100%;max-width:420px;background:#161b22;border:1px solid #30363d;
  border-radius:12px;padding:26px 22px 20px;box-shadow:0 18px 48px rgba(0,0,0,.55)}
.modal-title{font-size:1.25rem;font-weight:700;color:#f0f6fc;margin-bottom:10px;letter-spacing:-.2px}
.modal-msg{font-size:1.04rem;line-height:1.45;color:#f0f6fc;text-align:left;
  word-wrap:break-word;overflow-wrap:break-word;margin-bottom:8px}
.modal-detail{font-size:.9rem;color:#8b949e;text-align:left;margin-bottom:20px}
.modal-actions{display:flex;gap:10px}
.modal-btn{flex:1;min-height:52px;border-radius:12px;font-size:1.05rem;font-weight:600;
  border:1px solid #30363d;font-family:inherit;transition:transform .1s ease}
.modal-btn:active{transform:scale(.98)}
.modal-bt-cancel{background:#21262d;color:#8b949e}
.modal-bt-confirm{background:rgba(88,166,255,.22);color:#58a6ff;
  border-color:rgba(88,166,255,.55)}
@media (max-width:380px){
  .modal-actions{flex-direction:column}
}
/* ── HEADER ── */
header{display:flex;align-items:center;justify-content:space-between;padding:6px 6px 0}
h1{font-size:1.55rem;letter-spacing:-.3px;font-weight:700;color:#f0f6fc;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.counter{font-size:3rem;font-weight:200;color:#f0f6fc;font-variant-numeric:tabular-nums;
  line-height:1;display:flex;align-items:baseline;gap:6px}
.counter small{font-size:.78rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px}
/* ── THOUGHT-DUMP INPUT (autofocus on load, Enter appends instantly) ── */
.dumpit{position:sticky;top:0;z-index:20;margin:10px 0 4px}
.dumpit .glass{display:flex;gap:10px;align-items:center;padding:10px 14px}
#quickAdd{flex:1;background:transparent;border:none;color:#e6edf3;font-size:1.18rem;
  font-family:inherit;outline:none;min-height:52px}
#quickAdd::placeholder{color:#6e7681;font-size:1rem}
.dump-add{flex:0 0 auto;min-width:54px;min-height:52px;border-radius:16px;background:rgba(88,166,255,.22);
  color:#58a6ff;border:1px solid rgba(88,166,255,.45);font-size:1.25rem;font-weight:700}
/* ── NAV (one-destination-at-a-time buttons, ≥50px) ── */
nav{display:flex;gap:8px;margin:2px 0}
nav button{flex:1;min-height:52px;font-size:1.02rem;border-radius:16px;background:rgba(33,38,45,.5);
  color:#8b949e;backdrop-filter:blur(8px);border:1px solid rgba(48,54,61,.4)}
nav button.here{background:rgba(88,166,255,.22);color:#58a6ff;border:1px solid rgba(88,166,255,.5)}
/* ── PANES ── */
.pane{padding:14px}
h2{font-size:.82rem;text-transform:uppercase;letter-spacing:1.6px;color:#8b949e;margin:0 0 10px}
.lane-label{font-size:.78rem;text-transform:uppercase;letter-spacing:1.3px;color:var(--accent-focus);
  padding:14px 0 6px;font-weight:700}
/* ── ROUND-8: structural breathing room between the 3 core sections ──
   (1) quick capture  (2) 3-panel toggle nav  (3) active task list  */
.dumpit{margin:16px 0 0}
nav{margin-top:22px}
.pane{margin-top:22px}
/* ── ROUND-8: Decider left-align + reading width (was center/scrunched) ── */
#decideBody{text-align:left;max-width:60ch;margin:0 auto;line-height:1.5}
#decideBody .item{text-align:left}
#decideBody .state{text-align:left}
.loading{text-align:center}
/* ── ROWS / one thing at a time, huge targets ── */
.item{display:flex;align-items:flex-start;gap:14px;padding:1rem;min-height:64px;
  background:#161b22;border:1px solid #30363d;border-radius:18px;margin-bottom:10px;
  transition:transform .1s ease}
.item:last-child{margin-bottom:0}
.item .body{flex:1;min-width:0}
.item .title{font-size:1.18rem;color:#f0f6fc;line-height:1.5;font-weight:600;
  word-wrap:break-word;overflow-wrap:break-word;word-break:break-word;
  overflow:hidden;display:block;min-height:1.4em}
.item .ctx{font-size:.84rem;color:#8b949e;margin-top:4px;word-wrap:break-word;overflow-wrap:break-word}
/* ROUND-12 fix#3: tap-to-edit task name */
.etitle{font-size:1.18rem;color:var(--text-primary);line-height:1.4;font-weight:600;
  display:inline-block;word-wrap:break-word;overflow-wrap:break-word;word-break:break-word;
  cursor:text;text-decoration:none;border-bottom:1px dotted transparent}
.etitle:hover,.etitle:focus{outline:none;border-bottom:1px dotted var(--border-subtle);color:var(--text-primary)}
.edit-input{font-size:1.18rem;color:var(--text-primary);background:var(--bg-hover);
  border:1px solid var(--accent-focus);border-radius:10px;padding:2px 10px;min-height:46px;
  font-family:inherit;line-height:1.4;width:100%;outline:none}
.item .actions{display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
.item.is-active{background:var(--bg-hover);border:1px solid var(--accent-focus)}
/* ── BUTTONS ≥50px touch targets (premium: slate, thin, scale .98 press) ── */
.btn{border:1px solid #30363d;border-radius:16px;min-height:50px;padding:0 18px;font-size:1rem;font-weight:650;
  cursor:pointer;font-family:inherit;background:#161b22;color:#f0f6fc;
  display:inline-flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);
  transition:transform .1s ease,background .1s ease}
.btn:active{transform:scale(.98);opacity:.85;transition:transform .1s ease}
.btn-go{background:var(--bg-hover);color:var(--text-primary);border:1px solid var(--accent-focus)}
.btn-pick{background:rgba(88,166,255,.22);color:#58a6ff;border:1px solid #30363d}
.btn-sm{min-height:52px;padding:0 14px;font-size:.96rem}
.btn-bare{background:transparent;color:#8b949e;min-height:44px}
/* ── slots ── */
.slots{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.slot{min-height:52px;padding:0 14px;border-radius:16px;background:#161b22;
  color:#f0f6fc;border:1px solid #30363d;font-size:.94rem;cursor:pointer;font-family:inherit;
  transition:transform .1s ease}
.slot:active{transform:scale(.98)}
/* ── PLAN section — deep dark glass, ClickUp-inspired cards (round-7) ── */
.plan-card{display:flex;align-items:flex-start;gap:14px;padding:1rem;min-height:70px;
  background:#161b22;border:1px solid #30363d;border-radius:20px;
  margin-bottom:12px;box-shadow:0 6px 20px rgba(0,0,0,.4);
  transition:transform .1s ease}
.plan-card:active{transform:scale(.98)}
.plan-card:last-child{margin-bottom:0}
.plan-card .title{font-size:1.18rem;color:#f0f6fc;line-height:1.5;font-weight:650;
  word-wrap:break-word;overflow-wrap:break-word;word-break:break-word}
.plan-card .ctx{font-size:.84rem;color:#8b949e;margin-top:5px;word-wrap:break-word;overflow-wrap:break-word}
.plan-card .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.plan-book{min-height:52px;padding:0 16px;border-radius:16px;background:var(--bg-hover);
  color:var(--text-primary);font-size:.98rem;font-weight:650;border:1px solid var(--accent-focus);cursor:pointer;font-family:inherit;
  transition:transform .1s ease}
.plan-book:active{transform:scale(.98)}
.plan-note{font-size:.8rem;color:#8b949e;border:1px solid #30363d;
  background:rgba(210,153,34,.08);border-radius:12px;padding:10px 12px;margin-top:8px}
/* ── inputs ── */
input[type=date],input[type=text],input[type=time]{background:rgba(13,17,23,.6);
  border:1px solid rgba(48,54,61,.5);border-radius:14px;color:#e6edf3;padding:14px;
  font-size:1rem;font-family:inherit;width:100%;margin:2px 0}
/* ── states (no dead air) ── */
.state{padding:28px 20px;text-align:center}
.state .big{font-size:1.25rem;color:#e6edf3;font-weight:650;margin-bottom:8px}
.state .sub{font-size:1rem;color:#8b949e;line-height:1.55}
.state .btn{margin-top:18px}
.loading{color:#8b949e;font-size:1rem;padding:26px 18px;text-align:center;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
/* ── misc ── */
.plate{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:.86rem;color:#8b949e}
.plate .n{font-weight:800;color:var(--accent-focus);font-size:1.05rem}
.footer{color:#6e7681;font-size:.7rem;text-align:center;padding:24px 0 4px}
/* pick-3 mode: hide the bulk of the vault list — one thing at a time */
#pickBody.flush{max-height:22.5rem;overflow:hidden;position:relative}
#pickBody.flush:after{content:'';position:absolute;inset:0;pointer-events:none}
.show-rest{display:block;width:100%;min-height:56px;border-radius:16px;margin-top:14px;
  background:rgba(48,54,61,.28);color:#8b949e;font-size:1rem;border:1px solid rgba(48,54,61,.4)}
.done-pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
/* ── ROUND-8: move-date nudge sheet ── */
.bump-sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;
  align-items:flex-end;padding:16px 0 calc(env(safe-area-inset-bottom) + 18px);
  background:rgba(13,17,23,.55);backdrop-filter:blur(6px)}
.bump-sheet .glass-strong{width:100%;padding:20px 18px;border-radius:24px}
.bump-title{font-size:1.1rem;color:#f0f6fc;font-weight:700;margin-bottom:4px}
.bump-sub{font-size:.9rem;color:#8b949e;word-wrap:break-word;overflow-wrap:break-word;margin-bottom:14px}
.bump-sheet .actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bump-sheet #bumpDate{flex:1 1 150px}
.bump-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.bump-hint{font-size:.78rem;color:var(--text-muted)}
/* ROUND-12 fix#2: Undo toast */
.undo-toast{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 20px);z-index:60;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin:0 12px;padding:16px 16px;border-radius:16px;
  background:rgba(22,27,34,.92);border:1px solid var(--border-subtle);
  box-shadow:0 10px 28px rgba(0,0,0,.55);animation:toast-in .25s ease}
.undo-msg{flex:1;font-size:.95rem;color:var(--text-primary);word-wrap:break-word;overflow-wrap:break-word}
@keyframes toast-in{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
@media (min-width:700px){ body{font-size:1rem} }
</style>
</head>
<body>

<!-- ROUND-14 custom confirm modal (replaces window.confirm). Hidden by default. -->
<div id="confirmModal" class="modal" aria-hidden="true">
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div id="confirmTitle" class="modal-title">Add to calendar?</div>
    <div id="confirmMsg" class="modal-msg"></div>
    <div id="confirmDetail" class="modal-detail"></div>
    <div class="modal-actions">
      <button id="confirmCancel" class="modal-btn modal-bt-cancel" data-act="confirmdismiss">Cancel</button>
      <button id="confirmOk" class="modal-btn modal-bt-confirm" data-act="confirmok">Book It</button>
    </div>
  </div>
</div>

<header>
  <h1>Joe's Cockpit</h1>
  <div class="counter"><small>done today</small><span id="count">0</span></div>
</header>

<!-- thought-dump: autofocus on load; Enter appends instantly (optimistic) -->
<div class="dumpit">
  <div class="glass">
    <input id="quickAdd" type="text" inputmode="text" autocomplete="off"
      autocorrect="off" autocapitalize="sentences" spellcheck="false"
      placeholder="Quick thought… type + Enter" aria-label="Quick add a thought">
    <button class="dump-add" id="quickAddBtn" aria-label="Add thought">+</button>
  </div>
</div>

<nav>
  <button class="here" data-tab="pick">Pick 3</button>
  <button data-tab="decide">Decide</button>
  <button data-tab="plan">Plan</button>
</nav>

<section id="tab-pick" class="pane glass">
  <h2>Pick 3 to focus on</h2>
  <div id="pickBody"><div class="loading">Gathering today's…</div></div>
</section>

<section id="tab-decide" class="pane glass" style="display:none">
  <h2>One call at a time</h2>
  <div id="decideBody"><div class="loading">Pulling open decisions…</div></div>
</section>

<section id="tab-plan" class="pane glass" style="display:none">
  <h2>Block the time</h2>
  <div id="planBody"><div class="loading">Blocking your day…</div></div>
</section>

<!-- ROUND-8: Move-date nudge sheet — quick picks, not a raw date prompt -->
<div id="bumpSheet" class="bump-sheet" style="display:none" role="dialog" aria-label="Nudge this task">
  <div class="glass-strong">
    <div class="bump-title">Move this task</div>
    <div class="bump-sub" id="bumpTitle"></div>
    <div class="actions">
      <button class="btn btn-go btn-sm" data-act="bump-pick" data-day="+1">Tomorrow</button>
      <button class="btn btn-pick btn-sm" data-act="bump-pick" data-day="weekend">This weekend</button>
      <button class="btn btn-sm" data-act="bump-pick" data-day="+7">Next week</button>
      <input type="date" id="bumpDate" aria-label="Pick a day">
      <button class="btn btn-go btn-sm" data-act="bump-pick" data-day="custom">Go</button>
    </div>
    <div class="bump-foot">
      <button class="btn btn-sm btn-bare" data-act="bump-cancel">Cancel</button>
      <span class="bump-hint">it stays on your plate — just nudged</span>
    </div>
  </div>
</div>

<p class="footer">Joe's Cockpit · thin window over the vault</p>

<!-- ROUND-12 fix#2: Undo toast (fades after ~5s) -->
<div id="undoToast" class="undo-toast" style="display:none" role="status" aria-live="polite">
  <span class="undo-msg">Task completed</span>
  <button class="btn btn-sm btn-go" data-act="undo" data-path="">Undo</button>
</div>

<script>
var AUTH = localStorage.getItem('cockpit_auth') || '';
var plate = [];
var ACTIVE_TAB = 'pick';
var pickedLatest = [];

/* ── TACTILE: Web-Audio click + mobile haptic (Joe directive #1) ── */
var _ac = null;
function ensureAudio(){
  if (_ac) return _ac;
  try { _ac = new (window.AudioContext||window.webkitAudioContext)(); return _ac; }
  catch(e){ return null; }
}
function tapTone(){
  var c = ensureAudio(); if (!c) return;
  var t = c.currentTime;
  var o = c.createOscillator('sine'); var g = c.createGain();
  o.frequency.setValueAtTime(1180, t);     // clean bright "pop"
  o.frequency.setValueAtTime(880, t + 0.03);
  g.gain.setValueAtTime(0.28, t);
  g.gain.setValueAtTime(0.0001, t + 0.055); // ~0.05s sharp
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + 0.06);
}
function bumpHaptic(){                       // navigator.vibrate(15) safe-guard
  try { if (navigator.vibrate) navigator.vibrate(15); }
  catch(e){}                                 // iOS/desktop: no-op, silent
}
function zap(){ tapTone(); bumpHaptic(); }   // call on check-off / Enter

/* auth + api unchanged (vault-canonical reads/writes, do not rewire) */
function setAuth(){
  var t = prompt('Cockpit password:');
  if (!t) return;
  AUTH = t; localStorage.setItem('cockpit_auth', t);
  load();
}
function api(path, opts){
  opts = opts || {};
  var headers = {'Content-Type':'application/json'};
  if (AUTH) headers['X-Cockpit-Auth'] = AUTH;
  if (opts.body) opts.body = JSON.stringify(opts.body);
  opts.headers = headers;
  return fetch(path, opts).then(function(r){
    if (r.status === 401){ setAuth(); throw new Error('auth'); }
    return r.json();
  });
}
function esc(s){ return String(s==null?'':s).replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ── state helpers ── */
function stateBlock(big, sub, retry){
  return '<div class="state"><div class="big">'+big+'</div><div class="sub">'+sub+'</div>' +
    (retry ? '<button class="btn" data-act="retry">Try again</button>' : '') + '</div>';
}
function emptyBlock(big, sub){ return stateBlock(big, sub); }

/* ── PICK ── */
function itemCard(it, fresh){
  var onPlate = it.on_plate;
  var ctx = [];
  if (onPlate) ctx.push('on your plate now');
  if (it.decide_by && it.has_decide_by) ctx.push('by ' + it.decide_by);
  var act;
  if (it.kind === 'decision'){
    act = '<button class="btn btn-go btn-sm" data-act="accept" data-path="'+esc(it.path)+'">Decide</button>' +
          (onPlate?'':'<button class="btn btn-pick btn-sm" data-act="pick" data-path="'+esc(it.path)+'">Pick</button>');
  } else if (onPlate){
    act = '<button class="btn btn-go btn-sm" data-act="done" data-path="'+esc(it.path)+'">Done</button>' +
          '<button class="btn btn-sm" data-act="deselect" data-path="'+esc(it.path)+'">Remove</button>' +
          '<button class="btn btn-sm btn-bare" data-act="bump" data-path="'+esc(it.path)+'">Move date</button>';
  } else {
    act = '<button class="btn btn-pick btn-sm" data-act="pick" data-path="'+esc(it.path)+'">Pick</button>' +
          '<button class="btn btn-go btn-sm" data-act="done" data-path="'+esc(it.path)+'">Done</button>';
  }
  return '<div class="item'+ (onPlate?' is-active':'') + (fresh?' done-pop':'') +'">' +
    '<div class="body"><span class="etitle" data-act="edittask" data-path="'+esc(it.path)+'" role="button" tabindex="0">'+esc(it.title)+'</span>' +
    (ctx.length?'<div class="ctx">'+ctx.join(' · ')+'</div>':'') + '</div>' +
    '<div class="actions">'+act+'</div></div>';
}
function plate_full(){ return plate.length >= 3; }

/* ROUND-8 iOS-lag cache + ROUND-12 local plate mirror */
var _openCache = null;   // last /api/open payload (items + plate)

/* ROUND-12 fix#1 + ROUND-13: plate persistence across view switches.
   Server (02 Planner/_ Active Plate) is AUTHORITATIVE. localStorage is only
   a best-effort cache to avoid a rebuild-empty flash — it must NEVER overrule
   the server or block a pick. */
function plateLS(){ try { return localStorage.getItem('cockpit_plate')||''; } catch(e){ return ''; } }
function savePlateLS(){ try { localStorage.setItem('cockpit_plate', JSON.stringify(plate)); } catch(e){} }

function renderPick(d){
  _openCache = d;
  var server_plate = (d.plate && d.plate.length) ? d.plate : [];
  // local fallback ONLY if server plate is empty AND every cached path is one
  // of the currently-open items (never ghost/phantom picks resurrecting).
  var restored = server_plate;
  if (!server_plate.length && plateLS()){
    try {
      var ls = JSON.parse(plateLS())||[];
      var live = {}; for (var li=0; li<(d.items?d.items.length:0); li++) live[d.items[li].path]=1;
      // keep only cached paths that still exist in the open list
      ls = ls.filter(function(p){ return p && live[p]; });
      if (ls.length) restored = ls;
      else localStorage.removeItem('cockpit_plate');
    } catch(e){ /* corrupt cache — ignore */ }
  }
  plate = restored.slice();
  if (d.items){ // re-flag on_plate from the resolved plate so lanes are right
    for (var pi=0; pi<d.items.length; pi++){
      d.items[pi].on_plate = plate.indexOf(d.items[pi].path) !== -1;
    }
  }
  savePlateLS();
  var items = d.items || [];
  var active = items.filter(function(x){ return x.on_plate; });
  var rest = items.filter(function(x){ return !x.on_plate; });
  var html = '';
  // Active lane always first — the ONE thing (or up to 3) Joe is doing now.
  if (active.length){
    html += '<div class="lane-label">Active — your plate</div>' + active.map(function(x){return itemCard(x,false);}).join('');
  }
  // LIST-PARALYSIS KILLER (Joe directive #3): in Pick-3 mode the REST of the
  // vault list is completely HIDDEN by default. Show exactly ONE thing (the
  // active plate) with whitespace; only a deliberate "Show the rest" reveals
  // the queue, so a long list can never paralyse.
  var showRest = localStorage.getItem('cockpit_showrest') === '1';
  if (rest.length){
    if (plate_full()){
      html += '<div class="lane-label" style="opacity:.55">Up next — plate is full, finish one first</div>';
    }
    if (showRest){
      html += '<div class="lane-label" style="opacity:.55">Up next</div>' + rest.map(function(x){return itemCard(x,false);}).join('');
      html += '<button class="show-rest" data-act="togglerest">Hide the rest</button>';
    } else {
      html += (rest.length - active.length > 0 && !plate_full())
        ? '<button class="show-rest" data-act="togglerest">Show ' + (rest.length) + ' more — pick one of these</button>'
        : '';
    }
  }
  if (!active.length && !rest.length){
    html = emptyBlock('Nothing actionable right now','Goals and projects live in the vault — tell Hermes what you want next.');
  }
  document.getElementById('pickBody').innerHTML = html;
  renderPlate();
}

/* ── DECIDE ── */
function renderDecide(d){
  var out;
  if (d.cleared){
    var coming = (d.coming_up||[]).map(function(c){
      return '<div class="item"><div class="body"><div class="title">'+esc(c.title)+'</div>' +
        '<div class="ctx">coming up — '+esc(c.decide_by||'soon')+'</div></div></div>';
    }).join('');
    out = (d.coming_up&&d.coming_up.length)
      ? '<div class="state"><div class="big">You cleared the deck — nice.</div><div class="sub">Nothing needs your call right now. Here’s what’s coming up:</div></div>' + coming
      : emptyBlock('You cleared the deck — nice.','Nothing’s queued for a decision, and nothing’s coming up.');
  } else {
    out = d.decisions.map(function(dc){
      // ROUND-9: enforce left-align at the INJECTION POINT — the JS builder
      // must set this inline so it persists across re-renders (CSS alone was
      // overridden). padding:1rem, line-height:1.5, faint isolate background.
      var optsHtml = (dc.options&&dc.options.length)
        ? dc.options.map(function(opt, i){
            var isLean = dc.has_lean && dc.lean && (opt===dc.lean || opt.indexOf(dc.lean)===0 || dc.lean.indexOf(opt)===0);
            return '<button class="btn btn-sm '+(isLean?'btn-go':'btn-pick')+'" ' +
              'data-act="choose" data-path="'+esc(dc.path)+'" data-opt="'+esc(opt)+'" ' +
              'style="text-align:left;justify-content:flex-start;width:100%;line-height:1.5;padding:0.8rem 1rem;white-space:normal">' +
              (isLean?'✓ ':'')+'Option '+(i+1)+': '+esc(opt)+'</button>';
          }).join('')
        : '<button class="btn btn-go btn-sm" data-act="accept" data-path="'+esc(dc.path)+'" ' +
          'style="text-align:left;justify-content:flex-start;width:100%">'+
          (dc.has_lean?'Go with “'+esc(dc.lean)+'”':'Decided — done')+'</button>';
      var dateLine = dc.decide_by ? '<div class="ctx">decide by '+esc(dc.decide_by)+'</div>' : '';
      var escapeLine = '<button class="btn btn-sm btn-bare" data-act="rebase" data-path="'+esc(dc.path)+'" style="text-align:left;width:100%">Not today — change the date</button>';
      return '<div class="item decision" style="text-align:left;align-items:flex-start;padding:1rem;line-height:1.5;background:rgba(255,255,255,0.03)">' +
        '<div class="body">' +
        '<div class="ctx" style="color:#d29922;margin-bottom:2px;text-align:left">your call:</div>' +
        '<div class="title" style="text-align:left">'+esc(dc.title)+'</div>' + dateLine +
        '<div class="slots" style="flex-direction:column;align-items:stretch;margin-top:10px;justify-content:flex-start">'+optsHtml+'</div>' +
        escapeLine + '</div></div>';
    }).join('');
  }
  document.getElementById('decideBody').innerHTML = out;
}

/* ── PLAN ── */
function renderPlan(r){
  var items = r.items||[];
  if (!items.length || (r.plate_count||0) === 0){
    document.getElementById('planBody').innerHTML =
      emptyBlock('Pick your 3 first','Get 1–3 on your plate, then I’ll find open times and block them here.');
    return;
  }
  var html = items.map(function(it){
    // round-7: ClickUp-inspired plan cards matching the glass dark theme
    var slots = it.found ? it.slots.map(function(sl){
      return '<button class="plan-book" data-act="book" data-title="'+esc(it.title)+'" data-date="'+sl.date+'" data-start="'+sl.start+'" data-end="'+sl.end+'">'+esc(sl.label)+'</button>';
    }).join('') : '<div class="plan-note">No suggestion this week — set your own time below.</div>';
    var override =
      '<div class="plan-note" style="margin-top:4px">…or set your own time</div>' +
      '<div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">' +
      '<input type="date" id="own-day-'+esc(it.idx)+'" style="flex:1 1 130px">' +
      '<input type="time" id="own-start-'+esc(it.idx)+'" style="flex:0 0 100px" value="10:00">' +
      '<input type="time" id="own-end-'+esc(it.idx)+'" style="flex:0 0 100px" value="10:30">' +
      '<button class="plan-book" data-act="bookown" data-title="'+esc(it.title)+'" data-idx="'+esc(it.idx)+'">Book it</button></div>';
    return '<div class="plan-card"><div class="body">' +
      '<div class="title">'+esc(it.title)+'</div>' +
      '<div class="ctx">'+ (it.found?'tap a time to book it':'no free slot found yet — set your own below.') +'</div>' +
      '<div class="actions">'+slots+'</div>' + override + '</div>' +
      '</div>';
  }).join('');
  document.getElementById('planBody').innerHTML = html;
}
function renderPlanError(){
  document.getElementById('planBody').innerHTML =
    stateBlock('Couldn’t sync your calendar','Check the connection and try again.', true);
}

/* ── loads ── */
/* ROUND-8: optimistic single-task toggle — flip the item locally, patch the
   cached list, re-render THAT lane cheaply, then sync the write in the
   background. No full-list refetch+rebuild per tap = instant on iOS. */
function flipPlate(path, add){
  if (_openCache){                       // local-first: reuse cached items
    for (var i=0;i<_openCache.items.length;i++){
      if (_openCache.items[i].path === path){ _openCache.items[i].on_plate = add; break; }
    }
  }
  plate = add ? (plate.indexOf(path)<0 ? plate.concat([path]) : plate)
              : plate.filter(function(p){ return p!==path; });
  if (_openCache){ _openCache.plate = plate.slice(); _openCache.plate_full = plate.length>=3; }
  savePlateLS();                         // ROUND-12: persist locally too
  renderPick(_openCache);                // light rebuild from cache (no fetch)
  document.getElementById('plateCount').textContent = plate.length;
}

/* ROUND-13 (pick-persist bug): PERSIST the plate to the server and make the
   write authoritative. The POST is awaited + error-surfaced (NOT fire-and-
   forget — a silent 401/network drop was losing picks while the optimistic
   UI claimed they were saved). On success we reload the real plate from the
   server so the view always matches 02 Planner/_ Active Plate. */
function savePick(paths){
  var snapshot = (paths||[]).slice();
  api('/api/plate',{method:'POST',body:{paths:snapshot}}).then(function(r){
    // server returned the persisted plate -> trust it (authoritative)
    if (r && r.plate){
      plate = r.plate.slice();
      if (_openCache){ _openCache.plate = r.plate.slice(); _openCache.plate_full = r.plate.length>=3; }
      savePlateLS();
      renderPick(_openCache);
      document.getElementById('plateCount').textContent = plate.length;
    } else {
      alert('Couldn’t save your plate — try again.');
    }
  }).catch(function(){
    alert('Couldn’t save your plate — check the connection and try again.');
  });
}

function load(area){
  area = area || ACTIVE_TAB; ACTIVE_TAB = area;
  if (area==='pick'){
    document.getElementById('pickBody').innerHTML = '<div class="loading">Gathering today’s…</div>';
    api('/api/open').then(renderPick).catch(function(){
      document.getElementById('pickBody').innerHTML = stateBlock('Couldn’t reach your tasks','Check the vault connection and try again.', true);
    });
  } else if (area==='decide'){
    document.getElementById('decideBody').innerHTML = '<div class="loading">Pulling open decisions…</div>';
    api('/api/decide').then(renderDecide).catch(function(){
      document.getElementById('decideBody').innerHTML = stateBlock('Couldn’t load decisions','Check the connection and try again.', true);
    });
  } else if (area==='plan'){
    document.getElementById('planBody').innerHTML = '<div class="loading">Blocking your day…</div>';
    api('/api/schedule').then(renderPlan).catch(renderPlanError);
  }
  api('/api/today').then(updateCounter).catch(function(){});
}
function renderPlate(){
  var el = document.getElementById('plateCount');
  if (el) el.textContent = plate.length;
}
function todayStr(){
  var n = new Date();
  return n.getFullYear() + '-' + ('0'+(n.getMonth()+1)).slice(-2) + '-' + ('0'+n.getDate()).slice(-2);
}
/* ROUND-11 fix#2: Done-Today counter resets to 0 on a new calendar day. On
   first run each day (localStorage date != today), show 0 immediately so the
   morning always starts clean, then reconcile with the server payload. */
function updateCounter(d){
  var countEl = document.getElementById('count');
  if (!countEl) return;
  var today = todayStr();
  var last = localStorage.getItem('cockpit_counter_date');
  // day rolled (or first run): clean slate to 0 so every morning starts clean
  if (last !== today){
    countEl.textContent = '0';
    localStorage.setItem('cockpit_counter_date', today);
  } else {
    // same day: show the authoritative, deduped server count
    countEl.textContent = (d && d.done_count != null) ? d.done_count : '0';
  }
}

/* ── THOUGHT-DUMP: autofocus on load + Enter appends INSTANTLY (optimistic) ──
   Dispatched immediately, rendered with a pop, then synced after. Backend has
   no create-task endpoint this pass, so the optimistic row is appended to a
   local scratch list (dumps lost on reload until a create endpoint lands). */
function submitQuick(){
  var inp = document.getElementById('quickAdd');
  var text = (inp.value||'').trim();
  if (!text) return;
  zap();                                   // dopamine: click + haptic
  // OPTIMISTIC: render locally the instant Enter hits (zero network wait)
  var card = '<div class="item done-pop"><div class="body"><div class="title">'+esc(text)+'</div>' +
    '<div class="ctx">saving…</div></div></div>';
  var body = document.getElementById('pickBody');
  body.innerHTML = body.innerHTML + card;
  inp.value = '';
  inp.focus();                             // keep keyboard open for the next dump
  // PERSIST (round-7): POST to /api/add -> saves a real open-task note to the
  // Planner source (vault-canonical via vaultlib). On success refresh the list;
  // on failure flip the row to an honest note instead of faking success.
  api('/api/add', {method:'POST', body:{text: text}}).then(function(r){
    if (r && r.ok){
      // reflect saved status; reload so the new task shows as a real open task
      load('pick');
    } else {
      var note = r && r.output ? r.output : 'couldn’t save that one.';
      body.innerHTML = body.innerHTML.replace(card, card.replace('saving…', note));
    }
  }).catch(function(){
    body.innerHTML = body.innerHTML.replace(card, card.replace('saving…', 'couldn’t save that one.'));
  });
}

/* ROUND-12 fix#2: Undo toast — shows after a completion, auto-dismisses ~5s */
var _undoTimer = null;
function showUndo(path, title){
  var t = document.getElementById('undoToast');
  if (!t) return;
  t.querySelector('[data-act="undo"]').dataset.path = path;
  t.querySelector('.undo-msg').textContent = 'Completed: ' + (title||'task');
  t.style.display = 'flex';
  if (_undoTimer) clearTimeout(_undoTimer);
  _undoTimer = setTimeout(function(){ t.style.display = 'none'; }, 5000);
}

/* ── actions ── */
/* ROUND-14: custom confirm modal — replaces window.confirm. confirmDialog sets the
   message + stashes the ok callback; Confirm/Book It fires it, any dismiss clears. */
var _confirmOk = null;
function confirmDialog(title, msg, detail, okFn){
  document.getElementById('confirmTitle').textContent = title || 'Are you sure?';
  document.getElementById('confirmMsg').textContent = msg || '';
  document.getElementById('confirmDetail').textContent = detail || '';
  _confirmOk = okFn || null;
  var m = document.getElementById('confirmModal');
  m.classList.add('modal-active'); m.setAttribute('aria-hidden','false');
  document.getElementById('confirmOk').focus();
}
function dismissConfirm(){
  document.getElementById('confirmModal').classList.remove('modal-active');
  document.getElementById('confirmModal').setAttribute('aria-hidden','true');
  _confirmOk = null;
}

/* Backdrop tap = cancel (native-like), does not fire the ok callback. */
document.getElementById('confirmModal').addEventListener('click', function(ev){
  if (ev.target === this){ dismissConfirm(); }
}, true);

document.addEventListener('click', function(ev){
  var b = ev.target.closest('[data-act]');
  if (b && b.dataset.act) zap();           // tactile on any control tap
  if (!b) return;
  var act = b.dataset.act, path = b.dataset.path;
  if (act==='confirmok'){
    var fn = _confirmOk; dismissConfirm();     // 0ms dismiss, then act
    if (fn) fn();
    return;
  } else if (act==='confirmdismiss'){
    dismissConfirm(); return;
  }
  if (act==='pick'){
    if (plate_full()){ alert('Your plate is full — finish one of the 3 first.'); return; }
    // optimistic local flip first (0ms), then PERSIST to the server (the plate
    // file is authoritative — a fire-and-forget write that 401s/errors would
    // silently lose the pick while the UI looks done). Await + surface errors.
    flipPlate(path, true);
    savePick(plate);
  } else if (act==='deselect'){
    flipPlate(path, false);
    savePick(plate);
  } else if (act==='edittask'){
    // ROUND-12 fix#3: tap the task name -> editable inline input
    var cur = b.textContent;
    var input = document.createElement('input');
    input.type = 'text'; input.value = cur;
    input.className = 'edit-input';
    input.setAttribute('aria-label', 'Task name');
    var wrap = document.createElement('span');
    wrap.appendChild(input);
    b.replaceWith(wrap);
    input.focus();
    var done = function(save){
      if (saved) return;                 // never double-save (Enter + blur)
      saved = true;
      var val = (input.value||'').trim();
      if (save && val && val !== cur){
        // persist via the vault-safe rename endpoint
        api('/api/rename',{method:'POST',body:{path:path, title:val}}).then(function(r){
          if (r && r.ok){ load('pick'); }
          else { alert((r&&r.output)||'Couldn’t rename that.'); load('pick'); }
        });
      } else {
        load('pick');
      }
    };
    var onKey = function(e){
      if (e.key === 'Enter'){ done(true); }
      else if (e.key === 'Escape'){ done(false); }
    };
    // guard: Enter triggers save; blur may fire after — never double-save
    var saved = false;
    input.addEventListener('keydown', onKey);
    input.addEventListener('blur', function(){ done(true); });
  } else if (act==='done'){
    // ROUND-11 fix#3: 0ms optimistic — flip the row to Done on screen NOW,
    // bump the counter locally, THEN sync to the vault in the background so
    // a slow network never freezes the UI.
    if (_openCache){
      // remove the row now so the completed task vanishes off-screen instantly
      for (var di=0;di<_openCache.items.length;di++){
        if (_openCache.items[di].path === path){ _openCache.items.splice(di,1); break; }
      }
      renderPick(_openCache);
    }
    // bump the Done-Today counter immediately (optimistic number-go-up)
    var cEl = document.getElementById('count');
    if (cEl && todayStr() === (localStorage.getItem('cockpit_counter_date') || todayStr())){
      cEl.textContent = (parseInt(cEl.textContent||'0',10)||0) + 1;
    }
    // background sync
    api('/api/done',{method:'POST',body:{path:path}}).then(function(r){
      if (r && r.ok){
        showUndo(path, r.title || 'task');   // ROUND-12 fix#2: Undo toast
        load(); refreshCounter();
      }
      else if (r && r.deduped){ load(); refreshCounter(); }
      else { alert((r&&r.output) || 'Couldn’t mark that done.'); load(); }
    });
  } else if (act==='undo'){
    // ROUND-12 fix#2: reverse a completion — reopen the task + remove its /done
    api('/api/undone',{method:'POST',body:{path:path}}).then(function(r){
      if (r && r.ok){ load('pick'); refreshCounter(); }
      else if (r && r.not_done){ load('pick'); refreshCounter(); }
      else { alert((r&&r.output) || 'Couldn’t undo that.'); load('pick'); }
    });
  } else if (act==='accept'){
    api('/api/resolve',{method:'POST',body:{path:path}}).then(function(){ load('decide'); refreshCounter(); });
  } else if (act==='resolve'){
    api('/api/resolve',{method:'POST',body:{path:path}}).then(function(){ load('decide'); refreshCounter(); });
  } else if (act==='retry'){
    load();
  } else if (act==='rebase'){
    var d = prompt('New decide-by date (YYYY-MM-DD):');
    if (!d) return;
    api('/api/set-due',{method:'POST',body:{path:path,due:d}}).then(function(){ load('decide'); });
  } else if (act==='bump'){
    // ROUND-8: open the nudge sheet (quick picks, no raw date prompt)
    document.getElementById('bumpTitle').textContent = path.split('/').pop();
    document.getElementById('bumpSheet').style.display = 'flex';
  } else if (act==='bump-cancel'){
    document.getElementById('bumpSheet').style.display = 'none';
  } else if (act==='bump-pick'){
    var target = null;
    var day = b.dataset.day;
    if (day === 'custom'){
      target = document.getElementById('bumpDate').value;
      if (!target){ alert('Pick a day first.'); return; }
    } else {
      var n = new Date();
      if (day === 'weekend'){
        var dow = n.getDay(); // 0=sun,6=sat => "this weekend" = next Sat
        n.setDate(n.getDate() + ((6 - dow + 7) % 7) + (dow===6?7:0));
      } else if (day === '+1'){ n.setDate(n.getDate() + 1); }
      else if (day === '+7'){ n.setDate(n.getDate() + 7); }
      else { n.setDate(n.getDate() + (parseInt(day)||1)); }
      target = n.getFullYear() + '-' + ('0'+(n.getMonth()+1)).slice(-2) + '-' + ('0'+n.getDate()).slice(-2);
    }
    document.getElementById('bumpSheet').style.display = 'none';
    // sets the due date AND keeps it on the plate (reschedule-don't-drop)
    api('/api/set-due',{method:'POST',body:{path:path, due:target}}).then(function(){
      alert('Moved — still on your plate, now due ' + target + '.');
      load('pick');
    });
  } else if (act==='book'){
    var title=b.dataset.title,date=b.dataset.date,start=b.dataset.start,end=b.dataset.end;
    // ROUND-14: custom modal replaces window.confirm (native popup was jarring on iOS).
    // Show the modal; the Confirm button resolves bookConfirmed() below (0ms dismiss
    // then books). Last book attempt is stashed on the element for the modal handler.
    var btn=b;
    confirmDialog('Add to calendar?',
      'Add "'+title+'" to your calendar?',
      date+' · '+start+'–'+end,
      function(){
        // 0ms optimistic: mark the slot booked on screen NOW, sync in background
        var target=btn;
        target.textContent = '✓ Booked'; target.disabled = true;
        target.style.opacity = .6;
        api('/api/book',{method:'POST',body:{summary:title,start:date+'T'+start,end:date+'T'+end}}).then(function(r){
          if(!r.ok){ target.textContent = 'Book again'; target.disabled=false; target.style.opacity=1; alert(r.output||'Couldn’t book that one.'); }
        });
      });
  } else if (act==='bookown'){
    var t=b.dataset.title, ix=b.dataset.idx;
    var day=document.getElementById('own-day-'+ix).value;
    var ss=document.getElementById('own-start-'+ix).value;
    var ee=document.getElementById('own-end-'+ix).value;
    if(!day||!ss||!ee){ alert('Pick a day and start/end times first.'); return; }
    // 0ms optimistic
    b.textContent = '✓ Booked'; b.disabled = true; b.style.opacity = .6;
    api('/api/book',{method:'POST',body:{summary:t,start:day+'T'+ss,end:day+'T'+ee}}).then(function(r){
      if(!r.ok){ b.textContent = 'Book it'; b.disabled=false; b.style.opacity=1; alert(r.output||'Couldn’t book that one.'); }
    });
  } else if (act==='pickday'){
    var t=b.dataset.title; var d=prompt('Which day? (YYYY-MM-DD)');
    if(!d) return;
    api('/api/book',{method:'POST',body:{summary:t,start:d+'T09:00',end:d+'T09:30'}}).then(function(r){
      alert(r.ok ? 'Booked — on your calendar ✓' : (r.output||'Couldn’t book that one.'));
    });
  } else if (act==='togglerest'){
    var now = localStorage.getItem('cockpit_showrest') === '1';
    localStorage.setItem('cockpit_showrest', now ? '0' : '1');
    load('pick');
  }
});
function refreshCounter(){ api('/api/today').then(updateCounter).catch(function(){}); }

/* Enter appends instantly (Joe directive #2) — optimistic, no network wait */
document.getElementById('quickAdd').addEventListener('keydown', function(e){
  if (e.key === 'Enter' || e.keyCode === 13){ submitQuick(); }
});
document.getElementById('quickAdd').addEventListener('input', function(){});
document.getElementById('quickAddBtn').addEventListener('click', submitQuick);

/* tabs */
document.querySelectorAll('[data-tab]').forEach(function(tab){
  tab.addEventListener('click', function(){
    document.querySelectorAll('[data-tab]').forEach(function(t){t.classList.remove('here');});
    tab.classList.add('here');
    var k = tab.dataset.tab;
    ['pick','decide','plan'].forEach(function(p){
      document.getElementById('tab-'+p).style.display = (p===k?'block':'none');
    });
    load(k);
    if (k==='pick') document.getElementById('quickAdd').focus();
  });
});

/* service worker */
if ('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js'); }
if (!AUTH) setAuth(); else load('pick');
/* FRICTIONLESS: autofocus the dump input the instant the app loads */
(function(){ var q=document.getElementById('quickAdd'); if(q){ q.focus(); } })();
/* ROUND-11 fix#2: reset Done-Today to a clean 0 the moment the app loads on a
   new calendar day — before any network fetch resolves. */
(function(){
  var last = localStorage.getItem('cockpit_counter_date');
  var today = todayStr();
  if (last !== today){
    var c = document.getElementById('count');
    if (c) c.textContent = '0';
    localStorage.setItem('cockpit_counter_date', today);
  }
})();
</script>
